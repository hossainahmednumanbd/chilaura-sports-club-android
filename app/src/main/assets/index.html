<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><style>
*{box-sizing:border-box}body{margin:0;background:#f3f7f4;color:#153e2a;font-family:system-ui,sans-serif}header{padding:26px 18px;background:linear-gradient(130deg,#075638,#0b7852);color:#fff;border-radius:0 0 22px 22px}header h1{font-size:22px;line-height:1.5;margin:12px 0 5px}.logo{border:2px solid #e6c66e;border-radius:50%;width:70px;height:70px;display:grid;place-items:center;font-size:34px}main{padding:14px 14px 90px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.tile,.card{background:#fff;border:1px solid #d9e7dd;border-radius:14px;padding:15px;margin-bottom:10px;box-shadow:0 2px 7px #00000008}.tile{text-align:center;cursor:pointer}.tile i{font-size:30px;display:block;font-style:normal}.muted{color:#697e70;font-size:13px}.warning{background:#fff3d5;color:#725009;padding:10px;border-radius:9px;font-size:12px}h2{font-size:19px}button{font:inherit;cursor:pointer}.btn{background:#08643f;color:#fff;border:0;border-radius:9px;padding:10px 12px;margin:4px 4px 4px 0}.btn.alt{background:#dcece2;color:#164e31}.btn.red{background:#a22b2b}input,textarea{width:100%;padding:11px;margin:6px 0 12px;border:1px solid #c5d7cb;border-radius:8px;font:inherit}textarea{min-height:85px}nav{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:space-around;background:white;border-top:1px solid #dce9de;padding:12px 0}nav button{background:none;border:0;font-size:12px;color:#24553c}.desc{white-space:pre-wrap;line-height:1.5}
</style></head><body><header><div class="logo">⚽</div><h1 id="clubTitle"></h1><div id="tagline"></div></header><main><p class="warning">ডেমো সংস্করণ: তথ্য এই ফোনে থাকে। নিরাপদ অনলাইন অ্যাডমিন লগইন ও সবার ফোনে সিঙ্ক এখনো চালু হয়নি।</p><section id="screen"></section></main><nav><button onclick="show('home')">🏠 হোম</button><button onclick="show('members')">👥 সদস্য</button><button onclick="show('donations')">💚 ডোনেশন</button><button onclick="show('notices')">📢 নোটিশ</button><button onclick="show('admin')">⚙️ অ্যাডমিন</button></nav><script>
const sections={members:'সদস্য',advisors:'উপদেষ্টা',founders:'প্রতিষ্ঠাতা',committee:'কার্যকরী কমিটি',donations:'ডোনেশন',accounts:'আয়-ব্যয়',notices:'নোটিশ',events:'ইভেন্ট',gallery:'গ্যালারি'};const symbols={members:'👥',advisors:'🎓',founders:'🏅',committee:'📋',donations:'💚',accounts:'💰',notices:'📢',events:'🏆',gallery:'📷'};const initial={name:'চিলাউড়া সোহাগ এন্ড ফারহান স্পোর্টস ক্লাব',tagline:'ঐক্য • খেলাধুলা • সমাজসেবা',welcome:'আমাদের ক্লাবের কার্যক্রম ও তথ্য',about:'',contact:''};let settings,records,page='home';const el=id=>document.getElementById(id);const escapeHTML=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function load(){try{settings={...initial,...JSON.parse(localStorage.getItem('csf-settings')||'{}')};records=JSON.parse(localStorage.getItem('csf-records')||'{}')}catch(e){settings={...initial};records={}}for(const k in sections)if(!Array.isArray(records[k]))records[k]=[]}function save(){localStorage.setItem('csf-settings',JSON.stringify(settings));localStorage.setItem('csf-records',JSON.stringify(records))}function show(k){page=k;draw()}function draw(){el('clubTitle').textContent=settings.name;el('tagline').textContent=settings.tagline;const s=el('screen');if(page==='home'){s.innerHTML='<h2>'+escapeHTML(settings.welcome)+'</h2><div class="grid">'+Object.keys(sections).map(k=>'<div class="tile" onclick="show(\''+k+'\')"><i>'+symbols[k]+'</i>'+sections[k]+'</div>').join('')+'</div><div class="card"><b>ক্লাব পরিচিতি</b><p class="desc">'+escapeHTML(settings.about||'এখানে ক্লাবের পরিচিতি যুক্ত করা যাবে।')+'</p></div>';return}if(page==='admin'){s.innerHTML='<h2>অ্যাডমিন প্যানেল (ডেমো)</h2><p class="warning">এই সংস্করণে নিরাপদ লগইন নেই। সদস্যদের ব্যবহারের জন্য প্রকাশ করবেন না।</p><div class="grid">'+Object.keys(sections).map(k=>'<div class="tile" onclick="show(\''+k+'\')"><i>'+symbols[k]+'</i>'+sections[k]+' পরিচালনা</div>').join('')+'<div class="tile" onclick="show(\'settings\')"><i>⚙️</i>সব লেখা সম্পাদনা</div></div>';return}if(page==='settings'){s.innerHTML='<h2>ক্লাবের লেখা সম্পাদনা</h2><form id="settingsForm">'+Object.keys(initial).map(k=>'<label>'+({name:'ক্লাবের নাম',tagline:'স্লোগান',welcome:'স্বাগত বার্তা',about:'ক্লাব পরিচিতি',contact:'যোগাযোগ'}[k])+'<textarea name="'+k+'">'+escapeHTML(settings[k])+'</textarea></label>').join('')+'<button class="btn">সংরক্ষণ</button></form>';el('settingsForm').onsubmit=e=>{e.preventDefault();for(const [k,v] of new FormData(e.target))settings[k]=v;save();show('home')};return}s.innerHTML='<h2>'+sections[page]+'</h2><button class="btn" onclick="edit(null)">+ তথ্য যোগ করুন</button><input id="search" placeholder="খুঁজুন" oninput="renderList()"><div id="items"></div>';renderList()}function renderList(){const q=(el('search')?.value||'').toLowerCase(),a=records[page].filter(x=>(x.title+' '+x.detail).toLowerCase().includes(q));el('items').innerHTML=a.length?a.map(x=>'<div class="card"><b>'+escapeHTML(x.title)+'</b><p class="desc">'+escapeHTML(x.detail)+'</p>'+(page==='donations'||page==='accounts'?'<p>৳ '+escapeHTML(x.amount)+'</p>':'')+'<button class="btn alt" onclick="edit('+x.id+')">সম্পাদনা</button><button class="btn red" onclick="removeItem('+x.id+')">মুছুন</button></div>').join(''):'<p class="muted">এখনো কোনো তথ্য নেই।</p>'}function edit(id){const x=records[page].find(r=>r.id===id)||{};el('screen').innerHTML='<h2>'+sections[page]+' তথ্য</h2><form id="entry"><label>নাম / শিরোনাম<input name="title" required maxlength="150" value="'+escapeHTML(x.title||'')+'"></label><label>বিস্তারিত<textarea name="detail" maxlength="4000">'+escapeHTML(x.detail||'')+'</textarea></label>'+(page==='donations'||page==='accounts'?'<label>পরিমাণ (টাকা)<input type="number" min="0" step=".01" name="amount" value="'+escapeHTML(x.amount||0)+'"></label>':'')+'<button class="btn">সংরক্ষণ</button><button class="btn alt" type="button" onclick="show(page)">বাতিল</button></form>';el('entry').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target),o={id:id||Date.now(),title:String(f.get('title')).trim(),detail:String(f.get('detail')).trim(),amount:Number(f.get('amount')||0)};if(id){Object.assign(records[page].find(r=>r.id===id),o)}else records[page].unshift(o);save();show(page)}}function removeItem(id){if(confirm('তথ্যটি মুছবেন?')){records[page]=records[page].filter(r=>r.id!==id);save();draw()}}load();draw();
</script></body></html>
