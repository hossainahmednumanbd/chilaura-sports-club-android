<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><style>
*{box-sizing:border-box}body{margin:0;background:#f3f7f4;color:#153e2a;font-family:system-ui,sans-serif}header{padding:18px 20px 22px;background:linear-gradient(130deg,#075638,#0b7852);color:#fff;border-radius:0 0 22px 22px}header h1{font-size:21px;line-height:1.5;margin:12px 0 5px}.logo{border:2px solid #e6c66e;border-radius:50%;width:62px;height:62px;display:grid;place-items:center;font-size:34px}main{padding:16px 16px calc(105px + env(safe-area-inset-bottom,0px));max-width:720px;margin:auto}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.tile,.card{background:#fff;border:1px solid #d9e7dd;border-radius:17px;padding:17px;margin-bottom:12px;box-shadow:0 2px 7px #00000008}.tile{text-align:center;cursor:pointer;min-height:116px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:7px;font-size:15px;font-weight:600;line-height:1.4}.tile i{font-size:30px;display:block;font-style:normal}.muted{color:#697e70;font-size:13px}.warning{background:#fff3d5;color:#725009;padding:10px;border-radius:9px;font-size:12px}h2{font-size:19px}button{font:inherit;cursor:pointer}.btn{background:#08643f;color:#fff;border:0;border-radius:9px;padding:10px 12px;margin:4px 4px 4px 0}.btn.alt{background:#dcece2;color:#164e31}.btn.red{background:#a22b2b}input,textarea{width:100%;padding:11px;margin:6px 0 12px;border:1px solid #c5d7cb;border-radius:8px;font:inherit}textarea{min-height:85px}nav{position:fixed;bottom:0;left:0;right:0;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));align-items:stretch;background:#fff;border-top:1px solid #dce9de;box-shadow:0 -4px 18px #153e2a12;padding:7px 5px calc(8px + env(safe-area-inset-bottom,0px));z-index:10}nav button{background:none;border:0;color:#60766a;min-width:0;min-height:53px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:600;padding:3px 1px;border-radius:12px}nav button .nav-icon{font-size:21px;line-height:1.2}nav button.active{background:#e4f2e9;color:#075b3c}nav button span:last-child{white-space:nowrap}#moreMenu{position:fixed;bottom:calc(77px + env(safe-area-inset-bottom,0px));right:12px;left:12px;z-index:9;background:white;border:1px solid #d7e6dc;border-radius:18px;padding:15px;box-shadow:0 8px 30px #153e2a2a;max-width:600px;margin:auto}#moreMenu[hidden]{display:none}#moreMenu .grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}#moreMenu .tile{min-height:83px;padding:9px;font-size:12px}#moreMenu .tile i{font-size:24px}.section-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}.section-head h2{margin:0}.subtle{color:#6c8475;font-size:13px}.tile:active,.btn:active{transform:scale(.98)}.desc{white-space:pre-wrap;line-height:1.5}
</style></head><body><header><div class="logo">⚽</div><h1 id="clubTitle"></h1><div id="tagline"></div></header><main><p class="warning">ডেমো সংস্করণ: তথ্য এই ফোনে থাকে। নিরাপদ অনলাইন অ্যাডমিন লগইন ও সবার ফোনে সিঙ্ক এখনো চালু হয়নি।</p><section id="screen"></section></main><div id="moreMenu" hidden><div class="section-head"><b>অন্যান্য বিভাগ</b><button class="btn alt" onclick="toggleMore(false)">বন্ধ করুন ✕</button></div><div class="grid"><div class="tile" onclick="show('advisors')"><i>🎓</i>উপদেষ্টা</div><div class="tile" onclick="show('founders')"><i>🏅</i>প্রতিষ্ঠাতা</div><div class="tile" onclick="show('committee')"><i>📋</i>কমিটি</div><div class="tile" onclick="show('accounts')"><i>💰</i>আয়-ব্যয়</div><div class="tile" onclick="show('events')"><i>🏆</i>ইভেন্ট</div><div class="tile" onclick="show('gallery')"><i>📷</i>গ্যালারি</div><div class="tile" onclick="show('admin')"><i>⚙️</i>অ্যাডমিন</div></div></div><nav aria-label="প্রধান নেভিগেশন"><button data-nav="home" onclick="show('home')"><span class="nav-icon">⌂</span><span>হোম</span></button><button data-nav="members" onclick="show('members')"><span class="nav-icon">👥</span><span>সদস্য</span></button><button data-nav="donations" onclick="show('donations')"><span class="nav-icon">💚</span><span>ডোনেশন</span></button><button data-nav="notices" onclick="show('notices')"><span class="nav-icon">📢</span><span>নোটিশ</span></button><button data-nav="more" onclick="toggleMore()"><span class="nav-icon">☷</span><span>আরও</span></button></nav><script>
const sections={members:'সদস্য',advisors:'উপদেষ্টা',founders:'প্রতিষ্ঠাতা',committee:'কার্যকরী কমিটি',donations:'ডোনেশন',accounts:'আয়-ব্যয়',notices:'নোটিশ',events:'ইভেন্ট',gallery:'গ্যালারি'};const symbols={members:'👥',advisors:'🎓',founders:'🏅',committee:'📋',donations:'💚',accounts:'💰',notices:'📢',events:'🏆',gallery:'📷'};const initial={name:'চিলাউড়া সোহাগ এন্ড ফারহান স্পোর্টস ক্লাব',tagline:'ঐক্য • খেলাধুলা • সমাজসেবা',welcome:'আমাদের ক্লাবের কার্যক্রম ও তথ্য',about:'',contact:''};let settings,records,page='home';const el=id=>document.getElementById(id);const escapeHTML=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function load(){try{settings={...initial,...JSON.parse(localStorage.getItem('csf-settings')||'{}')};records=JSON.parse(localStorage.getItem('csf-records')||'{}')}catch(e){settings={...initial};records={}}for(const k in sections)if(!Array.isArray(records[k]))records[k]=[]}function save(){localStorage.setItem('csf-settings',JSON.stringify(settings));localStorage.setItem('csf-records',JSON.stringify(records))}function toggleMore(force){const menu=el('moreMenu');menu.hidden=typeof force==='boolean'?!force:!menu.hidden;updateNav()}function updateNav(){const more=!el('moreMenu').hidden;document.querySelectorAll('nav button').forEach(b=>{const k=b.getAttribute('data-nav');b.classList.toggle('active',k==='more'?more:k===page&&!more);b.setAttribute('aria-current',k===page&&!more?'page':'false')})}function show(k){page=k;el('moreMenu').hidden=true;draw();updateNav();window.scrollTo(0,0)}function draw(){el('clubTitle').textContent=settings.name;el('tagline').textContent=settings.tagline;const s=el('screen');if(page==='home'){s.innerHTML='<div class="section-head"><h2>'+escapeHTML(settings.welcome)+'</h2></div><div class="grid">'+Object.keys(sections).map(k=>'<div class="tile" onclick="show(\''+k+'\')"><i>'+symbols[k]+'</i>'+sections[k]+'</div>').join('')+'</div><div class="card"><b>ক্লাব পরিচিতি</b><p class="desc">'+escapeHTML(settings.about||'এখানে ক্লাবের পরিচিতি যুক্ত করা যাবে।')+'</p></div>';return}if(page==='admin'){s.innerHTML='<h2>তথ্য পরিচালনা (ডেমো)</h2><p class="warning">এই সংস্করণে নিরাপদ লগইন নেই। সদস্যদের ব্যবহারের জন্য প্রকাশ করবেন না।</p><div class="grid">'+Object.keys(sections).map(k=>'<div class="tile" onclick="show(\''+k+'\')"><i>'+symbols[k]+'</i>'+sections[k]+' পরিচালনা</div>').join('')+'<div class="tile" onclick="show(\'settings\')"><i>⚙️</i>সব লেখা সম্পাদনা</div></div>';return}if(page==='settings'){s.innerHTML='<h2>ক্লাবের লেখা সম্পাদনা</h2><form id="settingsForm">'+Object.keys(initial).map(k=>'<label>'+({name:'ক্লাবের নাম',tagline:'স্লোগান',welcome:'স্বাগত বার্তা',about:'ক্লাব পরিচিতি',contact:'যোগাযোগ'}[k])+'<textarea name="'+k+'">'+escapeHTML(settings[k])+'</textarea></label>').join('')+'<button class="btn">সংরক্ষণ</button></form>';el('settingsForm').onsubmit=e=>{e.preventDefault();for(const [k,v] of new FormData(e.target))settings[k]=v;save();show('home')};return}s.innerHTML='<h2>'+sections[page]+'</h2><button class="btn" onclick="edit(null)">+ তথ্য যোগ করুন</button><input id="search" placeholder="খুঁজুন" oninput="renderList()"><div id="items"></div>';renderList()}function renderList(){const q=(el('search')?.value||'').toLowerCase(),a=records[page].filter(x=>(x.title+' '+x.detail).toLowerCase().includes(q));el('items').innerHTML=a.length?a.map(x=>'<div class="card"><b>'+escapeHTML(x.title)+'</b><p class="desc">'+escapeHTML(x.detail)+'</p>'+(page==='donations'||page==='accounts'?'<p>৳ '+escapeHTML(x.amount)+'</p>':'')+'<button class="btn alt" onclick="edit('+x.id+')">সম্পাদনা</button><button class="btn red" onclick="removeItem('+x.id+')">মুছুন</button></div>').join(''):'<p class="muted">এখনো কোনো তথ্য নেই।</p>'}function edit(id){const x=records[page].find(r=>r.id===id)||{};el('screen').innerHTML='<h2>'+sections[page]+' তথ্য</h2><form id="entry"><label>নাম / শিরোনাম<input name="title" required maxlength="150" value="'+escapeHTML(x.title||'')+'"></label><label>বিস্তারিত<textarea name="detail" maxlength="4000">'+escapeHTML(x.detail||'')+'</textarea></label>'+(page==='donations'||page==='accounts'?'<label>পরিমাণ (টাকা)<input type="number" min="0" step=".01" name="amount" value="'+escapeHTML(x.amount||0)+'"></label>':'')+'<button class="btn">সংরক্ষণ</button><button class="btn alt" type="button" onclick="show(page)">বাতিল</button></form>';el('entry').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target),o={id:id||Date.now(),title:String(f.get('title')).trim(),detail:String(f.get('detail')).trim(),amount:Number(f.get('amount')||0)};if(id){Object.assign(records[page].find(r=>r.id===id),o)}else records[page].unshift(o);save();show(page)}}function removeItem(id){if(confirm('তথ্যটি মুছবেন?')){records[page]=records[page].filter(r=>r.id!==id);save();draw()}}load();draw();updateNav();
</script><style>
.person-row{display:flex;gap:12px;align-items:center;padding:13px 4px;border-bottom:1px solid #e5eee8}.person-row:last-child{border-bottom:0}.person-photo{width:62px;height:62px;flex-shrink:0;border-radius:50%;object-fit:cover;border:2px solid #d7e9df;background:#edf5ef}.person-photo.big{width:116px;height:116px;border:3px solid #168b57}.person-info{flex:1;min-width:0}.person-name{font-size:16px;font-weight:700;line-height:1.45}.person-meta{color:#5c7667;font-size:13px;margin-top:3px;overflow-wrap:anywhere}.person-view{border:0;background:#087244;color:white;border-radius:9px;padding:8px 12px;font-size:13px}.profile-top{text-align:center;background:linear-gradient(180deg,#e4f4e9,white);border-radius:18px;padding:22px 12px}.profile-top h2{margin:10px 0 4px}.profile-line{display:flex;gap:12px;align-items:flex-start;padding:12px 4px;border-bottom:1px solid #e4ece6;font-size:14px;overflow-wrap:anywhere}.profile-line strong{min-width:96px;color:#537363}.profile-line span{flex:1}.pill{display:inline-block;background:#d7f4df;color:#07643d;border-radius:20px;padding:4px 11px;font-size:12px}.filter-row{display:flex;gap:8px;margin:10px 0 15px;overflow:auto}.filter-row button{border:1px solid #d8e8df;background:white;padding:8px 13px;border-radius:20px;white-space:nowrap;font-size:13px}.filter-row button.selected{background:#087244;color:white}.person-form label{display:block;font-size:14px;font-weight:600;margin:10px 0}.person-form label input,.person-form label textarea,.person-form label select{display:block;margin-top:5px}.person-form select{width:100%;padding:12px;border:1px solid #c5d7cb;border-radius:8px;background:white;font:inherit}.person-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}.small-note{font-size:12px;color:#647e6d}
</style><script>
(function(){
const personSections=['members','advisors','founders','committee'];
let activeFilter='সব', photoDraft='';
const originalRenderList=renderList,originalEdit=edit;
const personSection=()=>personSections.includes(page);
const safe=escapeHTML;
const fallback='data:image/svg+xml;charset=UTF-8,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="120" height="120" viewBox="0 0 120 120"><rect width="120" height="120" rx="60" fill="#e2f0e7"/><circle cx="60" cy="43" r="23" fill="#83b79a"/><path d="M17 109c0-30 19-46 43-46s43 16 43 46" fill="#83b79a"/></svg>');
const avatar=x=>x.photo&&/^data:image\/(jpeg|png|webp);base64,/.test(x.photo)?x.photo:fallback;
const field=(label,value)=>value?'<div class="profile-line"><strong>'+safe(label)+'</strong><span>'+safe(value)+'</span></div>':'';
function personList(){
 const box=el('screen');
 box.innerHTML='<div class="section-head"><h2>'+safe(sections[page])+' তালিকা</h2><span class="subtle">'+records[page].length+' জন</span></div><input id="search" placeholder="নাম, পদবি বা মোবাইল দিয়ে খুঁজুন" oninput="renderList()"><div id="filters" class="filter-row"><button onclick="personFilter(\'সব\')">সকল</button><button onclick="personFilter(\'সক্রিয়\')">সক্রিয়</button><button onclick="personFilter(\'সাবেক\')">সাবেক</button></div><button class="btn" onclick="edit(null)">+ নতুন ব্যক্তি যোগ করুন</button><div class="card" id="items"></div>';
 renderList();
}
window.personFilter=function(f){activeFilter=f;renderList()};
renderList=function(){
 if(!personSection())return originalRenderList();
 const q=(el('search')?.value||'').toLowerCase();
 document.querySelectorAll('#filters button').forEach(b=>b.classList.toggle('selected',b.textContent===(activeFilter==='সব'?'সকল':activeFilter)));
 const rows=records[page].filter(x=>(activeFilter==='সব'||(x.status||'সক্রিয়')===activeFilter)&&[x.title,x.role,x.detail,x.phone,x.memberType].join(' ').toLowerCase().includes(q));
 el('items').innerHTML=rows.length?rows.map(x=>'<div class="person-row"><img class="person-photo" src="'+avatar(x)+'" alt=""><div class="person-info"><div class="person-name">'+safe(x.title)+'</div><div class="person-meta">'+safe(x.role||x.detail||sections[page])+'</div>'+(x.phone&&x.showPhone?'<div class="person-meta">'+safe(x.phone)+'</div>':'')+'</div><button class="person-view" onclick="personProfile('+JSON.stringify(x.id)+')">দেখুন</button></div>').join(''):'<p class="muted">কোনো ব্যক্তি পাওয়া যায়নি।</p>';
};
window.personProfile=function(id){
 const x=records[page].find(v=>String(v.id)===String(id));if(!x)return show(page);
 el('screen').innerHTML='<button class="btn alt" onclick="show(page)">← তালিকায় ফিরুন</button><div class="profile-top"><img class="person-photo big" src="'+avatar(x)+'" alt="প্রোফাইল ছবি"><h2>'+safe(x.title)+'</h2><div>'+safe(x.role||sections[page])+'</div><p><span class="pill">'+safe(x.status||'সক্রিয়')+'</span></p></div><div class="card">'+field('পদবি',x.role)+field('সদস্যের ধরন',x.memberType)+field('যোগদানের তারিখ',x.joinDate)+field('মোবাইল',x.showPhone?x.phone:'')+field('ইমেইল',x.showEmail?x.email:'')+field('ঠিকানা',x.address)+field('দায়িত্ব',x.detail)+'</div><div class="person-actions"><button class="btn alt" onclick="edit('+JSON.stringify(x.id)+')">সম্পাদনা</button><button class="btn red" onclick="removeItem('+JSON.stringify(x.id)+')">মুছুন</button></div><p class="small-note">ডেমো: নিরাপদ অ্যাডমিন অনুমতি এখনো চালু হয়নি।</p>';
 window.scrollTo(0,0);
};
function filePhoto(file){
 return new Promise((resolve,reject)=>{
  if(!file){resolve(photoDraft);return}
  if(!file.type.startsWith('image/')){reject(Error('ছবি নির্বাচন করুন'));return}
  const reader=new FileReader();
  reader.onerror=()=>reject(Error('ছবি পড়া যায়নি'));
  reader.onload=()=>{
   const img=new Image();
   img.onerror=()=>reject(Error('ছবি খোলা যায়নি'));
   img.onload=()=>{
    const canvas=document.createElement('canvas');const size=320;canvas.width=size;canvas.height=size;
    const ctx=canvas.getContext('2d');const side=Math.min(img.width,img.height);
    ctx.drawImage(img,(img.width-side)/2,(img.height-side)/2,side,side,0,0,size,size);
    resolve(canvas.toDataURL('image/jpeg',0.72));
   };
   img.src=reader.result;
  };
  reader.readAsDataURL(file);
 });
}
function input(name,label,value,type='text'){
 return '<label>'+label+'<input name="'+name+'" type="'+type+'" value="'+safe(value||'')+'"></label>';
}
function personEdit(id){
 const x=records[page].find(v=>String(v.id)===String(id))||{};photoDraft=x.photo||'';
 el('screen').innerHTML='<h2>'+(id?'প্রোফাইল সম্পাদনা':'নতুন ব্যক্তি যোগ করুন')+'</h2><form id="personForm" class="person-form">'+input('title','পূর্ণ নাম *',x.title)+input('role','পদবি / দায়িত্ব',x.role||(!x.role&&x.detail?x.detail:''))+input('phone','মোবাইল নম্বর',x.phone,'tel')+input('email','ইমেইল',x.email,'email')+input('address','ঠিকানা',x.address)+input('memberType','সদস্যের ধরন / বিভাগ',x.memberType)+input('joinDate','যোগদানের তারিখ',x.joinDate,'date')+'<label>অবস্থা<select name="status"><option value="সক্রিয়">সক্রিয়</option><option value="সাবেক">সাবেক</option></select></label><label>ছবি (ঐচ্ছিক)<input name="photoFile" type="file" accept="image/*"></label><label><input type="checkbox" name="showPhone" style="width:auto;margin-right:8px">প্রোফাইলে মোবাইল নম্বর দেখাবেন</label><label><input type="checkbox" name="showEmail" style="width:auto;margin-right:8px">প্রোফাইলে ইমেইল দেখাবেন</label><label>পদ ও দায়িত্বের বিবরণ<textarea name="detail">'+safe(x.detail||'')+'</textarea></label><button class="btn" type="submit">সংরক্ষণ করুন</button><button class="btn alt" type="button" onclick="show(page)">বাতিল</button></form><p class="small-note">ছবি ও তথ্য এখন শুধু এই ফোনে সংরক্ষিত হবে।</p>';
 const form=el('personForm');form.elements.status.value=x.status||'সক্রিয়';form.elements.showPhone.checked=!!x.showPhone;form.elements.showEmail.checked=!!x.showEmail;
 form.onsubmit=async e=>{
  e.preventDefault();const button=form.querySelector('[type=submit]');button.disabled=true;
  try{
   const f=new FormData(form);const title=String(f.get('title')||'').trim();if(!title){alert('নাম লিখুন');return}
   const photo=await filePhoto(form.elements.photoFile.files[0]);
   const obj={id:id||Date.now(),title,role:String(f.get('role')||''),phone:String(f.get('phone')||''),email:String(f.get('email')||''),address:String(f.get('address')||''),memberType:String(f.get('memberType')||''),joinDate:String(f.get('joinDate')||''),status:String(f.get('status')||'সক্রিয়'),showPhone:f.has('showPhone'),showEmail:f.has('showEmail'),detail:String(f.get('detail')||''),photo};
   if(id)Object.assign(records[page].find(v=>String(v.id)===String(id)),obj);else records[page].unshift(obj);
   save();show(page);
  }catch(err){alert('তথ্য সংরক্ষণ হয়নি: '+err.message)}finally{button.disabled=false}
 };
 window.scrollTo(0,0);
}
edit=function(id){if(personSection())return personEdit(id);return originalEdit(id)};
const oldDraw=draw;
draw=function(){oldDraw();if(personSection())personList()};
draw();updateNav();
})();
</script></body></html>
